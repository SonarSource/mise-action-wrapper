name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    runs-on: sonar-xs
    name: Build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install tools using mise wrapper
        uses: ./

      - name: Validate poetry came from the pipx backend
        shell: bash
        run: |
          poetry --version
          mise which poetry
          test -d ~/.local/share/mise/installs/poetry

      - name: Validate mise and pipx tool
        shell: bash
        run: |
          mise --version
          shellcheck --version
          shellcheck scripts/*.sh

  # Dogfood the composite action on Windows. github.action_path uses backslashes
  # there, and interpolating it into a bash run: line fails.
  build-windows:
    runs-on: warp-custom-windows-2022-m
    name: Build (Windows)
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # This repo's mise.toml installs pipx: tools. Warp Windows does not have
      # pipx on PATH, so a full `mise install` fails after the path fix.
      # Installing python only still runs Configure Repox (the original failure)
      # and proves mise itself works on this runner.
      - name: Install tools using mise wrapper
        uses: ./
        with:
          install_args: python

      - name: Validate wrapper ran on Windows
        shell: bash
        env:
          # python --version otherwise auto-installs the rest of mise.toml (poetry / pipx tools).
          MISE_NOT_FOUND_AUTOINSTALL: "false"
        run: |
          mise --version
          python --version
          test -n "${PIP_INDEX_URL:-}"
